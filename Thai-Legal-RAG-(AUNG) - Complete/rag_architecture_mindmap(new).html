<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Legal RAG — Architecture Mind Map</title>
<style>
:root{--bg:#f6f8fa;--fg:#14212b;--mute:#5b6b78;--line:#b8c4cd;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--fg:#e6edf2;--mute:#93a3b0;--line:#3a4b58;--card:#16222b}}
:root[data-theme="dark"]{--bg:#0f171d;--fg:#e6edf2;--mute:#93a3b0;--line:#3a4b58;--card:#16222b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif}
body{padding:24px 20px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mute);font-size:.95rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:20px;font-size:.85rem}
.flow span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.flow i{color:var(--mute);font-style:normal}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
svg{display:block;min-width:1100px;width:100%;height:auto}
svg text{fill:var(--fg);font-family:inherit}
.link{fill:none;stroke-width:2}
.g{transition:opacity .15s}
svg:hover .g{opacity:.28}
svg .g:hover{opacity:1}
.hint{color:var(--mute);font-size:.8rem;margin-top:10px}
</style>
</head>
<body>
<h1>Thai Legal RAG — สถาปัตยกรรมระบบ</h1>
<p class="sub">Hybrid Search (Dense + BM25) → Cross-Encoder Reranker → LLM พร้อมกลไก Abstain</p>
<div class="flow">
<span>PDF</span><i>→</i><span>Text + OCR</span><i>→</i><span>Chunks</span><i>→</i><span>FAISS + BM25</span><i>→</i><span>RRF</span><i>→</i><span>Rerank</span><i>→</i><span>LLM</span><i>→</i><span>Evaluate</span>
</div>
<div class="wrap"><svg id="m" role="img" aria-label="Mind map of the Thai Legal RAG architecture"></svg></div>
<p class="hint">เลื่อนเมาส์ไปที่กิ่งใดกิ่งหนึ่งเพื่อโฟกัสเฉพาะกิ่งนั้น</p>
<script>
const L=[
{t:"① Ingestion",s:"สกัดข้อความ",h:200,l:["PDF กฎหมายไทย ~85 ฉบับ (data/pdfs)","PyMuPDF: อ่าน text layer (sort=True)","ตรวจคุณภาพ: สัดส่วนอักษรไทย / สระลอย","Fallback: OCR Tesseract (tha+eng, 300 dpi)","clean_text: NFC, ตัดเลขหน้า, PyThaiNLP normalize"]},
{t:"② Chunk & Index",s:"แบ่งและสร้างดัชนี",h:160,l:["ThaiLegalChunker: แบ่งตาม มาตรา / ข้อ","Token-aware 256 tokens, overlap 48","Dense: “passage: ” + chunk → multilingual-e5-base","→ L2 normalize → FAISS IndexFlatIP (IP ≈ cosine)","Sparse: BM25 + ตัดคำ PyThaiNLP newmm","บันทึก chunks.json / dense.faiss / bm25.pkl"]},
{t:"⚙ Config",s:"config.py",h:35,l:["TOP_K_RETRIEVE 30 → TOP_K_FINAL 5, RRF_K 60","LLM + Judge: gemma-4-E4B-it (OpenAI API)","Reranker: BAAI/bge-reranker-v2-m3"]}];
const R=[
{t:"③ Retrieval",s:"4 โหมด (ablation)",h:280,l:["dense: “query: ” + คำถาม → e5 → L2 normalize → FAISS","bm25: keyword ตรงตัว (มาตรา, ศัพท์เฉพาะ)","hybrid: RRF รวมอันดับ Dense + BM25","hybrid_rerank: pool 30 → Cross-Encoder → top 5"]},
{t:"④ Generation",s:"สร้างคำตอบ",h:20,l:["System prompt: ตอบจากบริบทเท่านั้น ห้ามเดา","ไม่มีบริบท/ข้อมูลไม่พอ → “ไม่พบข้อมูลในเอกสารที่มี”","temperature 0, รองรับ streaming","อ้างอิงเลขมาตราและชื่อเอกสารเสมอ"]},
{t:"⑤ Evaluation",s:"ประเมินผล",h:340,l:["Retrieval: Recall@1/3/5, Hit, MRR, nDCG","Bootstrap 95% CI + paired p-value เทียบ dense","Testset แยก 2 ชุด: Answerable / Adversarial","Answerable: BERTScore (xlm-roberta-large)","Answerable: Faithfulness / Relevance (Judge)","Answerable: False Abstention Rate","Adversarial: Correct Abstention Rate","บันทึก failure_cases.json"]}];
const ROW=36,GAP=30,LW=340,BW=180,CW=200,W=1500;
const X={ll:10,bl:400,c:650,br:920,lr:1150};
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("m");
const bh=a=>a.reduce((s,b)=>s+b.l.length*ROW,0)+GAP*(a.length-1);
const H=Math.max(bh(L),bh(R))+80,cy=H/2;
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function txt(x,y,s,o,p){const e=el("text",Object.assign({x,y,"dominant-baseline":"middle"},o),p);e.textContent=s;return e}
function curve(x1,y1,x2,y2,c,p){const m=(x1+x2)/2;el("path",{d:`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`,class:"link",stroke:c},p)}
const cen=el("g",{});
el("rect",{x:X.c,y:cy-38,width:CW,height:76,rx:14,fill:"hsl(212 55% 30%)"},cen);
txt(X.c+CW/2,cy-10,"Thai Legal RAG",{"text-anchor":"middle","font-size":19,"font-weight":700,style:"fill:#fff"},cen);
txt(X.c+CW/2,cy+14,"Q&A เอกสารกฎหมายไทย",{"text-anchor":"middle","font-size":13,style:"fill:#dbe7f3"},cen);
function side(a,left){
  let y=(H-bh(a))/2;
  a.forEach(b=>{
    const col=`hsl(${b.h} 55% 45%)`,fill=`hsl(${b.h} 55% 50% / .14)`;
    const g=el("g",{class:"g"});
    const top=y,by=top+b.l.length*ROW/2;
    const bx=left?X.bl:X.br,lx=left?X.ll:X.lr;
    curve(left?X.c:X.c+CW,cy,left?bx+BW:bx,by,col,g);
    el("rect",{x:bx,y:by-28,width:BW,height:56,rx:12,fill:col},g);
    txt(bx+BW/2,by-8,b.t,{"text-anchor":"middle","font-size":16,"font-weight":700,style:"fill:#fff"},g);
    txt(bx+BW/2,by+13,b.s,{"text-anchor":"middle","font-size":12,style:"fill:#fff;opacity:.9"},g);
    b.l.forEach((s,i)=>{
      const ly=top+i*ROW+ROW/2;
      curve(left?bx:bx+BW,by,left?lx+LW:lx,ly,col,g);
      el("rect",{x:lx,y:ly-14,width:LW,height:28,rx:8,fill:fill,stroke:col,"stroke-width":1.2},g);
      txt(lx+12,ly,s,{"font-size":13},g);
    });
    y+=b.l.length*ROW+GAP;
  });
}
side(L,true);side(R,false);
</script>
</body>
</html>
