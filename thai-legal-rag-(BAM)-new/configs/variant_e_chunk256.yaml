raw_dir: data/clean
# Variant E (เสริม) — chunk เล็กลงครึ่งหนึ่ง
name: E_dense_chunk256
chunk:
  max_tokens: 256
  overlap_tokens: 32
  min_tokens: 48
retrieval:
  mode: dense
  use_reranker: false
  top_k_final: 5
generator:
  backend: openai
  model: gemma-4-E4B-it
evaluation:
  judge_backend: openai
  judge_model: gemma-4-E4B-it
